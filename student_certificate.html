<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Certificate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .certificate {
      width: 900px;
      background: #fff;
      border: 8px solid #1e3a8a;
      padding: 48px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      color: #1e3a8a;
    }

    h2 {
      margin: 12px 0 32px;
      font-weight: normal;
      color: #334155;
    }

    .student-name {
      font-size: 40px;
      margin: 24px 0;
      color: #0f172a;
      border-bottom: 2px solid #cbd5e1;
      display: inline-block;
      padding: 0 16px 8px;
    }

    .details {
      margin-top: 24px;
      font-size: 20px;
      color: #334155;
      line-height: 1.8;
    }

    .footer {
      margin-top: 56px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      color: #0f172a;
    }

    .signature {
      width: 220px;
      border-top: 1px solid #0f172a;
      padding-top: 8px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="certificate">
    <h1>Certificate of Achievement</h1>
    <h2>This certificate is proudly presented to</h2>

    <div class="student-name">John Doe</div>

    <div class="details">
      for successfully completing the course<br />
      <strong>Web Development Basics</strong><br />
      on <strong>20 February 2026</strong>
    </div>

    <div class="footer">
      <div>
        <div class="signature">Course Instructor</div>
      </div>
      <div>
        <div class="signature">Principal</div>
      </div>
    </div>
  </div>
</body>
</html>
